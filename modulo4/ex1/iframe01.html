<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        
    <!--Tamanho Padrão 300x150-->
    <!--scolling auto: se o conteúdo que estiver mostrando estiver faltando ele cria a barra de rolagem-->
    <!--scolling yes: sempre ira criar uma barra-->
    <!--scolling no: não ira criar barra de rolagem mas dependera também dos navegadores-->
    <!--frameborder: ele funciona de 0 - 1 criando apenas de 1px nada além-->
    <iframe src="https://www.cursoemvideo.com" frameborder="0" scolling="yes">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
    </iframe>
        
        
    para aprender a programar</p>

    <p>O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
        </iframe>


        Também é bem legal!
    </p>
</body>
</html>
