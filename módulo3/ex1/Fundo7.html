<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
    
        /*Centralização de uma caixa*/


        #container {
            background-image: url('imagens-cap19/target001.png');
            position: relative;
            height: 100vh;
            background-color: purple;
            padding: 10px;  
            background-size: 100% 100%;
        }

        /*Se usar o comando de position absolute será possivel usar os comandos left e top*/


        #conteudo {
            background-image: url('imagens-cap19/target001.png');
            background-size: 100% 100%;

            position: absolute;
            height: 200px;
            background-color: yellow;
            width: 400px;
            margin: auto;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);   
            /*O trasform ele serve para trasformar qualquer caixa aplicando um efeito sobre ela */
            /*O primeiro negativo do translate ele serve para mecher para esquerda e caso mude para positivo para direita*/
            /*O segundo negativo do translate ele serve para mecher para cima e caso mude para positivo é para baixo*/
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
