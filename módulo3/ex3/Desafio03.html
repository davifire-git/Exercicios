<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3 de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 200px;
            height: 70px;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
        }

        td   {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            border: 1px solid black;
            background-color: rgb(106, 106, 106);
            color: rgb(255, 255, 255);
            padding: 10px;
        }

        .branca {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Notas</caption>
        <tr>
            <th rowspan="2" colspan="2">Área</th>
            <th rowspan="2" colspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Média</th>
        </tr>
        <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
        </tr>
        <tr>
            <th rowspan="4" colspan="2" class="branca">Exatas</th>
            <td colspan="2">Matemática</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <td colspan="2">Física</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <td colspan="2">Química</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <td colspan="2">Biologia</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <th colspan="6">Média das Exatas</th>
            <td style="background-color: rgb(106, 106, 106); color: white;">10.0</td>
        </tr>
        <tr>
            <th rowspan="2" colspan="2" class="branca">Humanas</th>
            <td colspan="2">História</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <td colspan="2">Geografia</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>10.0</td>
        </tr>
        <tr>
            <th colspan="6">Média das Humanas</th>
            <td style="background-color: rgb(106, 106, 106); color: white;">10.0</td>
        </tr>
    </table>
</body>
</html>
