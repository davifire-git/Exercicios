<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Teste</title>
    <style>
        body {
            background-color: beige;
        }

        table {
            border: 5px solid rgb(95, 95, 95);
            border-collapse: collapse;
            height: 1000px;
            width: 1000px;
        }

        td {    
            border: 3px solid black;
            padding: 5px;
            text-align: center;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <h1>Repassando o estudo da tabela</h1>
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D2</td>
        </tr>
    </table>
</body>
</html>
