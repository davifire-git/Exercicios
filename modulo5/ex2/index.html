<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer login nas Contas do Google</title>
    <!-- Incluindo a fonte Roboto oficial do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="login-box">
                <div class="logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google">
                </div>
                <h1>Fazer login</h1>
                <h2>Use sua Conta do Google</h2>

                <form action="#">
                    <div class="input-form">
                        <div class="input-container">
                            <input type="text" id="email" required placeholder=" " autocomplete="off">
                            <label for="email">E-mail ou telefone</label>
                        </div>
                        <a href="#" class="forgot-email">Esqueceu seu e-mail?</a>
                    </div>

                    <div class="guest-info">
                        <p>Não está no seu computador? Use o modo visitante para fazer login com privacidade.</p>
                        <a href="#">Saiba mais sobre como usar o Modo visitante</a>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-create">Criar conta</button>
                        <button type="submit" class="btn-next">Avançar</button>
                    </div>
                </form>
            </div>

            <div class="footer">
                <div class="language-dropdown">
                    <select>
                        <option>Português (Brasil)</option>
                        <option>English (United States)</option>
                        <option>Español</option>
                    </select>
                </div>
                <ul class="footer-links">
                    <li><a href="#">Ajuda</a></li>
                    <li><a href="#">Privacidade</a></li>
                    <li><a href="#">Termos</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
