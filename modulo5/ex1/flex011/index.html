<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner { /*Pai*/
            background-color: lightsalmon;
            display: flex; /*O pai ultiliza display*/
            flex-flow: row nowrap;
        }

        div.item { /*Filhos*/
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            flex-shrink: 1; /*Ele diz se ele pode encolher ou não,sendo 0 (não podendo encolher) e sendo 1 (podendo encolher)*/
            flex-grow: 0; /*Ele diz se ele pode aumentar ou não,sendo 0(não podendo aumentar) e sendo 1 (podendo aumentar)*/
        }

        div#cxa {
        flex-shrink: 0;
        flex-grow: 0;            
        }

        div#cxb {
        flex-shrink: 1;
        flex-grow: 2;
        }   

        div#cxc {
        flex-shrink: 8;
        flex-grow: 4;    
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div>
</body>
</html>
